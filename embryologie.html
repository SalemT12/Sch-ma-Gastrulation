<html lang="fr"><head><meta charset="utf-8">

<title>Embryologie : légender la gastrulation du Xénope</title>
<style>
:root{--bg:#f6f4ef;--fg:#1f2a2e;--card:#fff;--ac:#1f6f78;--mut:#667;--bd:#d9d5ca;--ok:#2e7d32;--ko:#c62828;--cur:#e8590c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#14191b;--fg:#e8ecec;--card:#1e2629;--ac:#5bc0c9;--mut:#9aa6a8;--bd:#33403f;--ok:#66bb6a;--ko:#ef5350;--cur:#ff922b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:900px;margin:0 auto;padding:12px}
h1{font-size:1.35rem;margin:.2rem 0}h2{font-size:1.05rem;margin:.8rem 0 .4rem}.mut{color:var(--mut);font-size:.9rem}
button,select{font:inherit;color:inherit}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:11px 14px;min-height:44px;cursor:pointer}
.btn.g{background:var(--card);color:var(--fg);border:1px solid var(--bd)}

.card img{width:84px;height:84px;object-fit:cover;border-radius:8px;background:#fff}.card b{display:block}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.zw{overflow:auto;border:1px solid var(--bd);border-radius:12px;background:#fff;max-height:58vh;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
.im{position:relative}.im img{display:block;width:100%;user-select:none;-webkit-user-drag:none}
.mk{position:absolute;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;background:#555;color:#fff;font:700 13px/26px system-ui;text-align:center;border:2px solid #fff;opacity:.55}
.mk.cur{background:var(--cur);opacity:1;z-index:3;animation:p 1.3s infinite}.mk.ok{background:var(--ok);opacity:1}.mk.ko{background:var(--ko);opacity:1}
@keyframes p{50%{box-shadow:0 0 0 8px rgba(232,89,12,.3)}}
.tag{position:absolute;transform:translate(-50%,24px);background:#111;color:#fff;font-size:12px;padding:3px 7px;border-radius:6px;white-space:nowrap;z-index:5}
.qb{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:10px}
.opt{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:11px 12px;margin:6px 0;min-height:46px;cursor:pointer}
.opt.sel{border-color:var(--ac);outline:2px solid var(--ac)}.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.ko{background:var(--ko);color:#fff;border-color:var(--ko);opacity:.75}
.ex{border-left:4px solid var(--ac);padding:2px 10px;margin-top:8px;font-size:.95rem}.w{color:var(--cur)}
table{width:100%;border-collapse:collapse;font-size:.92rem}td{padding:6px;border-bottom:1px solid var(--bd);vertical-align:top}
select{padding:9px;border-radius:8px;border:1px solid var(--bd);background:var(--card);min-height:44px}
.im img{height:100%}.bxs{position:absolute;inset:0}
.bx{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;text-align:center;min-width:84px;min-height:36px;padding:2px 4px;border:2px dashed var(--ac);background:rgba(255,255,255,.93);color:#1f2a2e;font:600 11.5px/1.15 system-ui,sans-serif;border-radius:6px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.bx.em{color:var(--ac);font-size:18px}.bx.fl{border-style:solid;background:#e3f2f4}.bx.ok{border:2px solid #2e7d32;background:#e3f4e4}.bx.ko{border:2px solid #c62828;background:#fdeaea}.bx.lk{border:1px solid #999;background:rgba(255,255,255,.88);cursor:default;font-weight:500}
#mn{position:fixed;z-index:50;background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.35);padding:4px;overflow:auto;min-width:210px;max-width:min(92vw,330px)}
#mn button{display:block;width:100%;text-align:left;background:none;border:0;padding:11px 12px;min-height:44px;border-radius:8px;cursor:pointer}#mn button:hover,#mn button:active{background:var(--bd)}#mn .clr{color:var(--ko)}#mn.bb{padding:8px 12px;font-size:.92rem}#mn.bb p{margin:.3rem 0}
.zw{max-height:none}

const T={
blastocoele:["Blastocœle","Blastocoel","Cavité interne de la blastula, située du côté animal. Pendant la gastrulation elle est refoulée puis réduite par l’expansion de l’archentéron ; elle offre l’espace où migrent les cellules mésodermiques.","Ne pas confondre avec l’archentéron : le blastocœle est une cavité fermée héritée de la blastula, l’archentéron est une nouvelle cavité ouverte sur l’extérieur par le blastopore."],
blastocoele_deplace:["Blastocœle déplacé","Blastocoel displaced","Le blastocœle est refoulé du côté opposé au blastopore dorsal à mesure que l’archentéron s’agrandit ; il disparaît progressivement.","Il ne faut pas le prendre pour l’archentéron, cavité en formation qui prend sa place."],
superficielles:["Cellules superficielles","Superficial cells","Couche épithéliale externe de la région animale ; elle s’étend sur l’embryon (épibolie) et fait partie de l’ectoderme.","À distinguer des cellules profondes, situées sous elle."],
profondes:["Cellules profondes","Deep cells","Cellules situées sous la couche superficielle ; en s’intercalant radialement, elles amincissent le toit du blastocœle et font progresser l’épibolie de l’ectoderme.","Ne pas les confondre avec les grosses cellules vitellines végétatives (futur endoderme)."],
pole_animal:["Pôle animal","Animal pole","Pôle de l’œuf pauvre en vitellus (petites cellules pigmentées) ; il contient le blastocœle et donne surtout l’ectoderme.","Opposé au pôle végétatif, riche en vitellus."],
pole_vegetatif:["Pôle végétatif","Vegetal pole","Pôle riche en vitellus, formé de grosses cellules vitellines ; il donne l’endoderme.","Opposé au pôle animal."],
levre_dorsale:["Lèvre dorsale du blastopore","Dorsal blastopore lip","Première région d’involution, apparue du côté dorsal. Elle correspond à l’organisateur de Spemann-Mangold et initie la formation de l’archentéron et de l’axe dorso-ventral.","Distincte des lèvres latérale et ventrale, qui se forment ensuite et complètent le cercle du blastopore."],
mesoderme_dorsal:["Mésoderme dorsal","Dorsal mesoderm","Mésoderme involué par la lèvre dorsale, en position dorsale. Il donne notamment la notochorde (axial) et les somites (paraxial).","À ne pas confondre avec le mésoderme ventral, qui donne des dérivés latéraux et ventraux (sang, mésoderme latéral)."],
mesoderme:["Mésoderme","Mesoderm","Feuillet embryonnaire intermédiaire, formé par involution des cellules de la zone marginale ; il migre sous l’ectoderme en s’appuyant sur le toit du blastocœle.","Il se situe entre l’ectoderme (externe) et l’endoderme (interne)."],
endoderme:["Endoderme","Endoderm","Feuillet interne formé des grosses cellules vitellines végétatives ; il tapisse l’archentéron et donnera le revêtement du tube digestif et de ses annexes.","Ne pas le confondre avec le mésoderme, la bande rouge située entre l’endoderme et l’ectoderme."],
archenteron:["Archentéron","Archenteron","Cavité digestive primitive formée au cours de la gastrulation par involution des cellules ; elle s’ouvre par le blastopore et donnera la lumière du tube digestif.","Ne pas le confondre avec le blastocœle, cavité de la blastula qu’il remplace progressivement."],
endomesoderme_ant:["Endomésoderme antérieur","Anterior endomesoderm","Cellules endodermiques et mésodermiques placées à l’avant du front d’involution, du côté antérieur ; elles migrent en premier vers le pôle animal.","Ne pas le confondre avec le mésoderme dorsal situé derrière lui."],
ectoderme:["Ectoderme","Ectoderm","Feuillet externe issu de la région animale ; il donnera l’épiderme et le système nerveux (neurectoderme).","Ne pas le confondre avec le mésoderme (bande rouge située sous l’ectoderme)."],
notochorde:["Notochorde","Notochord","Bâtonnet axial dérivé du mésoderme dorsal, soutien temporaire de l’axe de l’embryon ; il participe à la mise en place de l’axe et à la régionalisation du tube neural.","Ne pas la confondre avec le tube neural, qui dérive de l’ectoderme."],
levre_laterale:["Lèvre latérale du blastopore","Lateral blastopore lip","Partie latérale du blastopore, formée après la lèvre dorsale ; l’involution de la zone marginale s’y poursuit sur les côtés.","À distinguer des lèvres dorsale et ventrale."],
levre_ventrale:["Lèvre ventrale du blastopore","Ventral blastopore lip","Dernière portion du blastopore à se former ; elle ferme le cercle blastoporal côté ventral.","À distinguer de la lèvre dorsale (organisateur)."],
bouchon:["Bouchon vitellin","Yolk plug","Amas de grosses cellules vitellines (endoderme) encore visible dans le blastopore ; il se réduit à mesure que l’ectoderme progresse par épibolie.","Ce n’est pas une lèvre : c’est le contenu du blastopore, pas son bord."],
mesenchyme:["Mésenchyme","Mesenchyme","Tissu lâche de cellules mésodermiques isolées et mobiles, migrant entre l’ectoderme et l’endoderme.","Différent d’un épithélium : les cellules sont peu jointives et migratrices."],
mesoderme_ventral:["Mésoderme ventral","Ventral mesoderm","Mésoderme involué du côté ventral, formant une bande sous l’ectoderme ventral ; il donne des dérivés latéraux et ventraux (mésoderme latéral, sang).","Distinct du mésoderme dorsal, qui donne notochorde et somites."]};
const X={blastopore:["Blastopore","Blastopore"],plaque_neurale:["Plaque neurale","Neural plate"],cretes_neurales:["Crêtes neurales","Neural crest"],tube_neural:["Tube neural","Neural tube"],somites:["Somites","Somites"],epiblaste:["Épiblaste","Epiblast"],hypoblaste:["Hypoblaste","Hypoblast"],macromeres:["Macromères","Macromeres"],micromeres:["Micromères","Micromeres"],zone_marginale:["Zone marginale","Marginal zone"],trophoblaste:["Trophoblaste","Trophoblast"]};
const G=[["mesoderme","mesoderme_dorsal","mesoderme_ventral","endomesoderme_ant","mesenchyme","notochorde","somites","zone_marginale"],["blastocoele","blastocoele_deplace"],["endoderme","endomesoderme_ant","bouchon","pole_vegetatif","hypoblaste","macromeres"],["ectoderme","superficielles","profondes","pole_animal","plaque_neurale","cretes_neurales","tube_neural","epiblaste","micromeres"],["levre_dorsale","levre_laterale","levre_ventrale","blastopore","zone_marginale","bouchon"]];
const MODES={exam:"Examen",train:"Entraînement"},LV={f:"Facile",m:"Intermédiaire",d:"Difficile"};
const $=s=>document.querySelector(s),A=$("#app");
let P={st:{},err:[]};try{P=JSON.parse(localStorage.getItem("embryo-v2"))||P}catch(e){}
const save=()=>{try{localStorage.setItem("embryo-v2",JSON.stringify(P))}catch(e){}};
let mode="exam",lvl="all",onlyErr=false,S=null,zoom=100,msg="";
const shuf=a=>{a=a.slice();for(let i=a.length;i>1;){const j=Math.random()*i--|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const nm=id=>(T[id]||X[id])[0],full=id=>{const a=T[id]||X[id];return a[0]+" ("+a[1]+")"};
const keys=Object.keys(D);
const stat=s=>{const r=P.st[s]||{};let n=0,ok=0;D[s].L.forEach((_,i)=>{if(r[i]!=null){n++;ok+=r[i]}});return{n,ok,t:D[s].L.length}};
const ex=t=>{const a=T[t];return`<div class=ex><b>${full(t)}</b><p>${a[2]}</p><p><i>Confusion possible :</i> ${a[3]}</p></div>`};
function home(){S=null;cl();let a=0,o=0,t=0;keys.forEach(s=>{const z=stat(s);a+=z.n;o+=z.ok;t+=z.t});
 A.innerHTML=`<h1>Embryologie : légender la gastrulation</h1><div class=mut>Gastrulation du Xénope (panneaux A à F de votre schéma). Touchez les cases vides du schéma pour choisir la légende.</div>
 <h2>Progression globale : ${a}/${t} légendes abordées, ${o} réussies</h2><div class=bar><i style="width:${t?a/t*100:0}%"></i></div>
 <h2>Mode</h2><div class=chips>${Object.entries(MODES).map(([k,v])=>`<button class="chip ${k==mode?"on":""}" onclick="mode='${k}';home()">${v}</button>`).join("")}</div>
 <div class=mut style="margin-top:6px">${mode=="exam"?"Aucune correction avant « Vérifier mes réponses ».":"Correction immédiate à chaque choix, tentatives illimitées."}</div>
 <h2>Révision ciblée</h2><div class=chips>${[["all","Toutes difficultés"],["f","Facile"],["m","Intermédiaire"],["d","Difficile"]].map(([k,v])=>`<button class="chip ${lvl==k?"on":""}" onclick="lvl='${k}';home()">${v}</button>`).join("")}<button class="chip ${onlyErr?"on":""}" onclick="onlyErr=!onlyErr;home()">Mes erreurs seulement</button></div>
 <div class=mut style="margin-top:6px">Les légendes hors sélection restent affichées, les autres sont à compléter.</div>
 ${msg?`<p class=w>${msg}</p>`:""}
 <h2>Stades</h2><div class=grid>${keys.map(s=>{const z=stat(s);return`<div class=card onclick="openS('${s}')"><img src="${D[s].img}"><div class=sp><b>${D[s].title}</b><span class=mut>Panneau ${s} · ${z.t} légendes · ${z.ok}/${z.t} réussies</span><div class=bar style="margin-top:5px"><i style="width:${z.n/z.t*100}%"></i></div></div><button class="btn g" title="Recommencer ce stade" onclick="event.stopPropagation();delete P.st['${s}'];save();home()">↺</button></div>`}).join("")}</div>
 <h2>Historique des erreurs</h2>${hist()}
 <p class=mut>Schéma original conservé (traits et flèches inclus) ; seuls les textes des légendes sont remplacés par des cases. Intitulés des stades ajoutés d’après les légendes.</p>`;msg=""}
function hist(){if(!P.err.length)return'<div class=mut>Aucune erreur enregistrée.</div>';
 return`<table>${P.err.slice(-12).reverse().map(e=>`<tr><td>${e.s}</td><td>${nm(e.t)}</td><td class=mut>${MODES[e.mode]} · ${new Date(e.d).toLocaleDateString("fr-FR")}</td></tr>`).join("")}</table><button class="btn g" style="margin-top:6px" onclick="P.err=[];save();home()">Effacer l’historique</button>`}
function openS(s){const act=D[s].L.map((l,i)=>(lvl=="all"||l.l==lvl)&&(!onlyErr||(P.st[s]||{})[i]===0));
 if(!act.some(Boolean)){msg="Aucune légende ne correspond à ces critères.";return home()}
 S={s,mode,act,ans:{},opts:{},chk:false};zoom=100;stage()}
function boxes(){const r=[];D[S.s].L.forEach((l,i)=>{const a=S.ans[i];let c="bx",t="";
 if(!S.act[i]){c+=" lk";t=nm(l.t)}
 else if(S.chk){c+=a==l.t?" ok":" ko";t=nm(l.t)}
 else if(S.mode=="train"&&a){c+=a==l.t?" ok":" ko";t=nm(a)}
 else if(a){c+=" fl";t=nm(a)}else{c+=" em";t="?"}
 r.push(`<div class="${c}" data-i=${i} style="left:${l.x}%;top:${l.y}%;width:${l.w}%;height:${l.h}%">${t}</div>`)});return r.join("")}
function stage(){const d=D[S.s];
 A.innerHTML=`<div class=row><button class="btn g" onclick="home()">←</button><b>Stade ${S.s} · ${MODES[S.mode]}</b></div><div class=mut>${d.title}</div>
 <div class=row style="margin:6px 0"><button class="btn g" onclick="zm(-50)">−</button><span class=mut>Zoom <span id=zl>${zoom}%</span></span><button class="btn g" onclick="zm(50)">+</button></div>
 <div class=zw id=zw><div class=im style="width:${zoom}%;aspect-ratio:${d.w}/${d.h}"><img src="${d.img}" draggable=false><div class=bxs>${boxes()}</div></div></div>
 <div class=qb id=ctl></div><div id=exl></div>`;ctl();$("#zw").addEventListener("scroll",cl);$(".bxs").addEventListener("click",tapb)}
function ctl(){const n=S.act.filter(Boolean).length,a=Object.keys(S.ans).filter(i=>S.act[i]).length;let ok=0;if(S.chk)D[S.s].L.forEach((l,i)=>{if(S.act[i]&&S.ans[i]==l.t)ok++});
 $("#ctl").innerHTML=S.chk?`<b>Score : ${ok}/${n}</b><div class=bar style="margin:6px 0"><i style="width:${ok/n*100}%"></i></div><div class=mut>Touchez une case pour lire l’explication de la structure.</div><button class=btn style="margin-top:6px" onclick="again()">Recommencer</button>`
 :`<div class=mut>${a}/${n} légendes complétées</div><div class=row style="margin-top:6px"><button class=btn onclick="check()">Vérifier mes réponses</button><button class="btn g" onclick="again()">Tout effacer</button></div>`}
function zm(d){zoom=Math.max(100,Math.min(400,zoom+d));cl();$(".im").style.width=zoom+"%";$("#zw").style.maxHeight=zoom>100?"78vh":"none";$("#zl").textContent=zoom+"%"}
function opts(i){if(S.opts[i])return S.opts[i];const id=D[S.s].L[i].t,bad=new Set([id]);G.forEach(g=>g.includes(id)&&g.forEach(x=>bad.add(x)));
 const pool=shuf(Object.keys(T).concat(Object.keys(X)).filter(x=>!bad.has(x)));return S.opts[i]=shuf([id,...pool.slice(0,3+(Math.random()*3|0))])}
function tapb(e){const b=e.target.closest(".bx");if(!b)return;e.stopPropagation();const i=+b.dataset.i;if(!S.act[i])return cl();
 if(S.chk||(S.mode=="train"&&S.ans[i]==D[S.s].L[i].t))return bubble(i,b);menu(i,b)}
function put(m,el){document.body.appendChild(m);const r=el.getBoundingClientRect(),vw=innerWidth,vh=innerHeight,up=r.top-10,dn=vh-r.bottom-10;
 m.style.maxHeight=Math.max(up,dn,160)+"px";const mw=m.offsetWidth,mh=m.offsetHeight;
 const above=mh<=up||(mh>dn&&up>=dn);m.style.top=(above?Math.max(8,r.top-mh-6):Math.min(r.bottom+6,vh-mh-8))+"px";
 m.style.left=Math.max(8,Math.min(r.left+r.width/2-mw/2,vw-mw-8))+"px"}
function menu(i,b){cl();const m=document.createElement("div");m.id="mn";
 m.innerHTML=opts(i).map(x=>`<button data-v="${x}">${nm(x)}</button>`).join("")+(S.ans[i]?'<button data-v="" class=clr>Effacer ma réponse</button>':"");
 m.onclick=e=>{const v=e.target.dataset&&e.target.dataset.v;if(v!=null)pick(i,v)};put(m,b)}
function bubble(i,b){cl();const l=D[S.s].L[i],a=S.ans[i],m=document.createElement("div");m.id="mn";m.className="bb";
 m.innerHTML=`<p><b>${a==l.t?"✔ Correct":"✘ Incorrect"}</b>${a==l.t?"":" · votre réponse : "+(a?nm(a):"aucune")}</p>`+ex(l.t);put(m,b)}
function cl(){const m=$("#mn");if(m)m.remove()}
function rec(i,v){(P.st[S.s]=P.st[S.s]||{})[i]=v;if(!v)P.err.push({s:S.s,t:D[S.s].L[i].t,d:Date.now(),mode:S.mode});save()}
function pick(i,v){cl();const l=D[S.s].L[i];if(v)S.ans[i]=v;else delete S.ans[i];
 if(S.mode=="train"&&v){S.first=S.first||{};if(S.first[i]==null){S.first[i]=1;rec(i,v==l.t?1:0)}}
 $(".bxs").innerHTML=boxes();ctl()}
function check(){cl();D[S.s].L.forEach((l,i)=>{if(!S.act[i]||(S.first&&S.first[i]!=null))return;rec(i,S.ans[i]==l.t?1:0)});S.chk=true;$(".bxs").innerHTML=boxes();ctl();
 $("#exl").innerHTML="<h2>Explications</h2>"+D[S.s].L.map((l,i)=>S.act[i]?ex(l.t):"").join("")}
function again(){S.ans={};S.opts={};S.chk=false;S.first=null;stage()}
document.addEventListener("click",e=>{if(!e.target.closest("#mn")&&!e.target.closest(".bx"))cl()});
addEventListener("scroll",cl);addEventListener("resize",cl);
home();
</script></body></html>
